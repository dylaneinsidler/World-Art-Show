<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dylan's World Art Show</title>
<meta name="theme-color" content="#0c0c0d">
<!-- The art is asked for without saying which page wants it: the Art Institute of Chicago refuses pictures for a
     page on this computer (localhost, where the PC and the Screens run the show), so they never showed there. -->
<meta name="referrer" content="no-referrer">
<!-- Added to an iPad home screen, it opens full screen like an app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dylan's World Art Show">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="art.ico">
<link rel="stylesheet" href="details.css">
<style>
  :root {
    --bg: #0c0c0d;
    --ink: #f3f0ea;
    --ink-2: rgba(243, 240, 234, .74);
    --ink-3: rgba(243, 240, 234, .50);
    --label-h: clamp(66px, 9.5vh, 100px);
    --side: max(clamp(18px, 3vw, 56px), env(safe-area-inset-left), env(safe-area-inset-right));
    --top: calc(clamp(18px, 3.4vh, 44px) + env(safe-area-inset-top));
    --bottom: env(safe-area-inset-bottom);
    --fade: 1400ms;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    position: fixed; inset: 0;
    color: var(--ink);
    font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;   /* swipes change the piece; no scrolling or zooming the page */
  }
  body.idle, body.idle * { cursor: none; }

  /* Two slides stacked; the new one fades in over the old one. */
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity var(--fade) ease; }
  .slide.shown { opacity: 1; }
  .slide.front { z-index: 1; }

  /* Every piece fills the same frame: the art is fitted whole (never cropped), and the space around it
     is filled with a soft, dark, blurred copy of the same piece. */
  .wash {
    position: absolute; inset: -80px;
    background-size: cover; background-position: center;
    filter: blur(50px) saturate(1.1) brightness(.40);
  }
  .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 62%, rgba(0, 0, 0, .55)); }
  .frame {
    position: absolute; left: var(--side); right: var(--side);
    top: var(--top); bottom: calc(var(--label-h) + var(--bottom));
    display: flex; align-items: center; justify-content: center;
  }
  .art { display: block; box-shadow: 0 20px 70px rgba(0, 0, 0, .55), 0 3px 10px rgba(0, 0, 0, .35); }

  .label {
    position: absolute; right: var(--side); bottom: var(--bottom); height: var(--label-h);
    max-width: min(62vw, 900px);
    display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
    gap: 3px; text-align: right;
  }
  @media (orientation: portrait) {
    .label { max-width: calc(100vw - 2 * var(--side) - 70px); }
  }
  .label > * { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who { font-size: clamp(13px, 1.55vh, 16px); font-weight: 600; letter-spacing: .01em; }
  .who .country { font-weight: 400; color: var(--ink-2); }
  .who .dot { color: var(--ink-3); margin: 0 .45em; font-weight: 400; }
  .what { font: italic clamp(12px, 1.4vh, 14.5px) Georgia, "Times New Roman", serif; color: var(--ink-2); }
  .where { font-size: clamp(10.5px, 1.2vh, 12px); color: var(--ink-3); text-decoration: none; letter-spacing: .02em; }
  .where:hover { color: var(--ink-2); text-decoration: underline; }

  #status {
    position: absolute; z-index: 2; left: var(--side); bottom: var(--bottom); height: var(--label-h);
    display: flex; align-items: center;
    font-size: clamp(11px, 1.25vh, 13px); color: var(--ink-3); letter-spacing: .04em;
  }
  #welcome {
    position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; padding: 0 24px; text-align: center;
    transition: opacity 900ms ease; pointer-events: none;
  }
  #welcome h1 { margin: 0; font: 300 clamp(26px, 4.2vh, 44px) "Segoe UI Variable Display", "Segoe UI", -apple-system, system-ui, sans-serif; letter-spacing: .28em; text-transform: uppercase; }
  #welcome p { margin: 0; font-size: clamp(12px, 1.4vh, 14px); color: var(--ink-3); letter-spacing: .06em; }
  #welcome.gone { opacity: 0; }

  /* The desktop show (two screens, opened by launch.ps1 with ?desktop): the art fills this screen, and the
     artist, title and everything else about it are on the right screen. */
  /* Digital art on or off: shown while the show is paused (on the iPad, tap to pause). */
  #digital {
    display: none; position: absolute; z-index: 3; left: var(--side); top: var(--top);
    padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .3);
    background: rgba(0, 0, 0, .45); color: var(--ink); font-size: 14px; cursor: pointer;
  }
  #digital.on { background: rgba(255, 255, 255, .85); color: #111; }
  body.paused #digital { display: block; }
  #hideThis { display: none; position: absolute; z-index: 3; left: var(--side); top: calc(var(--top) + 48px); padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .3); background: rgba(0, 0, 0, .45); color: var(--ink); font-size: 14px; cursor: pointer; }
  body.paused #hideThis { display: block; }
  body.desktop .label, body.desktop #status, body.desktop #digital, body.desktop #hideThis { display: none; }
  body.desktop .frame { top: clamp(28px, 5vh, 60px); bottom: clamp(28px, 5vh, 60px); }
  #close {
    display: none; position: absolute; z-index: 4; top: 18px; right: 18px;
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .28);
    background: rgba(0, 0, 0, .38); color: #fff; font: 300 24px/44px "Segoe UI", sans-serif; text-align: center;
    cursor: pointer; opacity: .75; transition: opacity .2s, background .2s;
  }
  #close:hover { opacity: 1; background: rgba(190, 40, 40, .85); }
  body.desktop #close { display: block; }
  body.desktop.idle #close { cursor: pointer; }

  /* Light: a pale gallery wall around the piece instead of the dark one. */
  body.light { --bg: #efebe4; --ink: #1f1c18; --ink-2: rgba(31, 28, 24, .74); --ink-3: rgba(31, 28, 24, .50); }
  body.light .wash { filter: blur(70px) saturate(.9) brightness(1.45); opacity: .5; }
  body.light .shade { display: none; }
  body.light .art { box-shadow: 0 18px 50px rgba(0, 0, 0, .22), 0 2px 8px rgba(0, 0, 0, .15); }
  body.light #close { background: rgba(255, 255, 255, .6); color: #222; border-color: rgba(0, 0, 0, .2); }
  body.light #close:hover { background: rgba(190, 40, 40, .85); color: #fff; }
</style>
</head>
<body>
<div class="slide" id="slideA"></div>
<div class="slide" id="slideB"></div>
<div id="status"></div>
<div id="digital">Digital art: Off</div>
<div id="hideThis">Don't show this again</div>
<div id="welcome"><h1>Dylan's World Art Show</h1><p id="welcomeNote">Getting the newest art…</p></div>
<div id="close" title="Close both screens">✕</div>

<script src="opened.js" onerror="void 0"></script>
<script src="close.js"></script>
<script src="details.js"></script>
<script>
'use strict';

const SECONDS_PER_PIECE = 60;
const LOAD_TIMEOUT_MS = 15000;          // a museum server that hasn't sent the picture by then is stuck
const CATALOG_REFRESH_MS = 60 * 60e3;   // while open, check for a newer art list every hour
// How often an artist comes up, by where their work comes from. The museums' picks count fully; DeviantArt
// (staff picks from a huge site) counts half, so it doesn't crowd out the museums.
const SOURCE_WEIGHT = { 'DeviantArt': 0.5 };

const $ = id => document.getElementById(id);
const statusEl = $('status');
const touch = matchMedia('(pointer: coarse)').matches;

// On the PC, launch.ps1 opens this page as the left of two screens (?desktop), served by its own small web
// server; the right screen (about.html) tells the story of whatever is showing here. The art list still
// comes from the website, so it's always the newest.
const DESKTOP = new URLSearchParams(location.search).has('desktop');
const SITE = 'https://dylaneinsidler.github.io/World-Art-Show/';
if (DESKTOP) document.body.classList.add('desktop');

// On the iPad the art matches the way it's held: landscape pieces when it's sideways, portrait pieces when
// it's upright (near-square pieces fit both). The computer's window is always wide, so it shows every shape.
const MATCH_SHAPE = touch;
function shapeOf(w, h) {
  if (!w || !h) return 'unknown';
  return w / h > 1.05 ? 'landscape' : h / w > 1.05 ? 'portrait' : 'square';
}
function screenShape() { return innerWidth >= innerHeight ? 'landscape' : 'portrait'; }
function fits(shape) { return !MATCH_SHAPE || shape === 'square' || shape === 'unknown' || shape === screenShape(); }

// ------------------------------------------------------------------ the art list

// GitHub rebuilds catalog.json every few hours from the museums, Wikidata and DeviantArt. It's fetched
// fresh every time the show opens (and again while it stays open), so the newest art is always in.
let catalogBuilt = null, catalogCheckedAt = 0;
let byCountry = new Map(), artistWeight = new Map(), countryWeight = new Map();
let artistMemory = 0, countryMemory = 0;

// Digital art only when it's turned on: otherwise the show is art made by hand, the museums' paintings, drawings
// and prints, and DeviantArt's pieces tagged with a traditional medium (2.12: before, Off left out all of DeviantArt,
// so the show had only the museums' few hundred pieces, which hardly ever change). On the iPad the choice is kept
// on the iPad (tap to pause, then "Digital art"); on the PC, launch.ps1 keeps it for every copy of the show (the
// switch is on the right screen).
const isDigital = w => w.source === 'DeviantArt' && w.medium !== 'hand';
let showDigital = DESKTOP ? false : load('digital', false);
let lastCatalog = null;

// Pieces never to show: ones you've hidden (the "Don't show again" button: kept on the iPad, or by launch.ps1
// on the PC), and any whose title points to male nudity or gay themes. Women are fine.
const UNWANTED = /\b(male nudes?|nude (man|men|male|boy|boys|youth)|naked (man|men|boy|boys)|(man|men|boy|boys) naked|gay|queer|lgbt\w*|homoerotic\w*|homosexual\w*|drag (queen|king)s?|two men|men kissing|boyfriends)\b/i;
const hiddenPages = new Set(DESKTOP ? [] : load('hidden', []));

function hidePieces(pages) {
  const fresh = pages.filter(p => !hiddenPages.has(p));
  if (!fresh.length) return;
  fresh.forEach(p => hiddenPages.add(p));
  if (!DESKTOP) save('hidden', [...hiddenPages]);
  if (lastCatalog) { useCatalog(lastCatalog); upcoming = null; }
  if (shownWork && hiddenPages.has(shownWork.page)) advance();
}

function setDigital(on) {
  if (on === showDigital) return;
  showDigital = on;
  if (!DESKTOP) save('digital', on);
  $('digital').textContent = `Digital art: ${on ? 'On' : 'Off'}`;
  $('digital').classList.toggle('on', on);
  if (lastCatalog) { useCatalog(lastCatalog); upcoming = null; }
  // Turned off with a digital piece on screen: on to a museum piece now.
  if (!on && shownWork && isDigital(shownWork) && !paused) advance();
}

async function fetchCatalog() {
  const r = await fetch(DESKTOP ? SITE + 'catalog.json' : 'catalog.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error('catalog ' + r.status);
  return r.json();
}

function useCatalog(catalog) {
  const col = Object.fromEntries(catalog.fields.map((f, i) => [f, i]));
  // country -> artist -> works. A piece is picked by country first, so the show travels the world
  // instead of mostly showing the countries whose artists the museums collect most.
  lastCatalog = catalog;
  byCountry = new Map();
  artistWeight = new Map();
  for (const r of catalog.works) {
    const w = { artist: r[col.artist], country: r[col.country], title: r[col.title], date: r[col.date],
                source: r[col.source], page: r[col.page], image: r[col.image], medium: r[col.medium],
                shape: shapeOf(r[col.w], r[col.h]) };
    if (!showDigital && isDigital(w)) continue;
    if (hiddenPages.has(w.page) || UNWANTED.test(w.title || '')) continue;
    const country = w.country.split(' / ')[0];
    w.artistKey = w.artist + '|' + w.country;
    if (!byCountry.has(country)) byCountry.set(country, new Map());
    const artists = byCountry.get(country);
    if (!artists.has(w.artistKey)) artists.set(w.artistKey, []);
    artists.get(w.artistKey).push(w);
    artistWeight.set(w.artistKey, Math.max(artistWeight.get(w.artistKey) || 0, SOURCE_WEIGHT[w.source] ?? 1));
  }
  // Bigger art scenes come up more often, but only by the square root of their size, so every country
  // gets regular turns.
  countryWeight = new Map([...byCountry].map(([country, artists]) =>
    [country, Math.sqrt([...artists.keys()].reduce((sum, a) => sum + artistWeight.get(a), 0))]));
  artistMemory = Math.min(600, Math.floor(artistWeight.size * 0.6));
  countryMemory = Math.min(8, Math.floor(byCountry.size / 3));
  catalogBuilt = catalog.built;
}

async function refreshCatalog() {
  catalogCheckedAt = Date.now();
  try {
    const catalog = await fetchCatalog();
    if (catalog.built !== catalogBuilt && catalog.works.length) {
      useCatalog(catalog);
      upcoming = null;       // the next piece is picked again from the new list
    }
  } catch { /* offline for now: keep showing what we have */ }
}

// ------------------------------------------------------------------ memory between sessions

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem('worldArtShow.' + key)) ?? fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem('worldArtShow.' + key, JSON.stringify(value)); } catch { /* private window: fine */ }
}
const seen = new Set(load('seen', []));                // pages already shown, so pieces don't repeat
let recentArtists = load('recentArtists', []);          // no artist twice until many others have had a turn
let recentCountries = load('recentCountries', []);      // and no country twice in a row
// A museum whose image server keeps refusing (on October 9 the Art Institute of Chicago's turned everyone away) is
// set aside for half an hour, so the show goes on with the others instead of stalling. One that doesn't answer
// at all (on October 23 the National Gallery of Denmark's sent nothing for over a minute) is set aside for three
// hours. That's remembered between openings: the Morning and Night Screens and the iPad's cycler open the show
// fresh every turn, and each turn used to wait on the same stuck server again. DeviantArt's pictures all come from
// one server, which is most of the show since 2.12, so it's only set aside for ten minutes; and a picture that ran
// out of time while the show was hidden (an iPad asleep) doesn't count against its server.
const hostFails = new Map(), hostDownUntil = new Map(Object.entries(load('hostDown', {})));
const hostOf = url => { try { return new URL(url).host; } catch { return ''; } };
const isDeviantArtHost = host => /(^|\.)wixmp\.com$|(^|\.)deviantart\.(net|com)$/.test(host);
function setHostAside(host, ms) {
  hostDownUntil.set(host, Date.now() + ms);
  hostFails.set(host, 0);
  save('hostDown', Object.fromEntries([...hostDownUntil].filter(([, until]) => until > Date.now())));
}
function noteFailure(url, timedOut) {
  failed.add(url);
  const host = hostOf(url), n = (hostFails.get(host) || 0) + 1;
  hostFails.set(host, n);
  if (isDeviantArtHost(host)) { if (n >= 3) setHostAside(host, 10 * 60e3); }
  else if (timedOut) setHostAside(host, 3 * 3600e3);
  else if (n >= 3) setHostAside(host, 30 * 60e3);
}
const usableImage = w => !failed.has(w.image) && !((hostDownUntil.get(hostOf(w.image)) || 0) > Date.now());
const failed = new Set();                               // images that wouldn't load this session

// On the PC every copy of the show (its own window, the Morning and Night Screens, the App Tester) runs in its own
// browser and kept its own memory, so each showed again what the others had shown. launch.ps1 keeps one list for all
// of them (seen.txt, 2.12): it's read when the show opens, and each piece shown is added to it. When the server
// answers, its list is the memory (plus any piece this copy couldn't tell it about yet); the first time, this copy's
// own memory goes into it.
const SHARED_SEEN = DESKTOP;
let unsent = load('unsentSeen', []);
async function postSeen(body) {
  const r = await fetch('/api/seen', { method: 'POST', body: JSON.stringify(body) });
  if (!r.ok) throw new Error('seen ' + r.status);
}
async function loadSharedSeen() {
  if (!SHARED_SEEN) return;
  try {
    if (!load('seenShared', false)) { await postSeen({ pages: [...seen] }); save('seenShared', true); }
    if (unsent.length) { await postSeen({ pages: unsent }); unsent = []; save('unsentSeen', []); }
    const r = await fetch('/api/seen', { cache: 'no-store' });
    const pages = r.ok ? await r.json() : null;
    if (!Array.isArray(pages)) return;
    seen.clear();
    pages.forEach(p => seen.add(p));
  } catch { /* the server is starting or closing: this copy's own memory will do */ }
}
function tellShownPiece(page) {
  if (!SHARED_SEEN) return;
  postSeen({ page }).catch(() => { unsent = [...unsent.filter(p => p !== page), page].slice(-500); save('unsentSeen', unsent); });
}

function remember(work) {
  seen.delete(work.page);          // (a piece coming round again moves to the end)
  seen.add(work.page);
  if (seen.size > 30000) seen.delete(seen.values().next().value);
  tellShownPiece(work.page);
  recentArtists = [...recentArtists.filter(a => a !== work.artistKey), work.artistKey].slice(-artistMemory);
  const country = work.country.split(' / ')[0];
  recentCountries = [...recentCountries.filter(c => c !== country), country].slice(-countryMemory);
  save('seen', [...seen]);
  save('recentArtists', recentArtists);
  save('recentCountries', recentCountries);
}

// ------------------------------------------------------------------ choosing the next piece

function randomItem(list) { return list[Math.floor(Math.random() * list.length)]; }

function weightedItem(list, weightOf) {
  let r = Math.random() * list.reduce((sum, x) => sum + weightOf(x), 0);
  for (const x of list) { if ((r -= weightOf(x)) < 0) return x; }
  return list[list.length - 1];
}

// A country, then an artist there, then one of their pieces that ok() allows; recent countries and artists wait
// their turn when useRecent is on.
function chooseWork(ok, avoid, useRecent) {
  const recentA = new Set(useRecent ? recentArtists : []), recentC = new Set(useRecent ? recentCountries : []);
  const options = [];
  for (const [country, artists] of byCountry) {
    if (recentC.has(country)) continue;
    const fresh = [...artists.keys()].filter(a => !recentA.has(a) && !avoid.has(a) && artists.get(a).some(ok));
    if (fresh.length) options.push({ country, fresh });
  }
  if (!options.length) return null;
  const choice = weightedItem(options, o => countryWeight.get(o.country));
  const artist = weightedItem(choice.fresh, a => artistWeight.get(a));
  return randomItem(byCountry.get(choice.country).get(artist).filter(ok));
}

// Only pieces that haven't been shown yet (2.12: an artist whose pieces had all been shown could still be picked,
// and then one of them came back, so after a few weeks most of the show was repeats). If every new piece is by a
// recent artist or country, those come anyway. If there are new pieces but none can load just now (their server is
// set aside for a while), one shown before stands in and nothing is forgotten. Only when every piece that fits has
// been shown does the half of them shown longest ago come round again.
function pickWork(avoid) {
  const loads = w => fits(w.shape) && usableImage(w), ok = w => loads(w) && !seen.has(w.page);
  const work = chooseWork(ok, avoid, true) || chooseWork(ok, avoid, false);
  if (work || avoid.size || !byCountry.size) return work;
  const fitting = [];
  for (const artists of byCountry.values()) for (const ws of artists.values()) for (const w of ws) if (fits(w.shape)) fitting.push(w);
  if (!fitting.length) return null;
  if (fitting.some(w => !seen.has(w.page))) return chooseWork(loads, avoid, false);
  forgetOldestSeen(new Set(fitting.map(w => w.page)));
  return chooseWork(ok, avoid, false) || chooseWork(loads, avoid, false);
}
function forgetOldestSeen(pages) {
  const shown = [...seen].filter(p => pages.has(p)), forget = shown.slice(0, Math.ceil(shown.length / 2));
  forget.forEach(p => seen.delete(p));
  save('seen', [...seen]);
  if (SHARED_SEEN) postSeen({ forget }).catch(() => {});
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    // A picture that runs out of time while the show is hidden (an iPad asleep) isn't its server's fault.
    let hidden = document.hidden;
    const onHide = () => { if (document.hidden) hidden = true; };
    document.addEventListener('visibilitychange', onHide);
    const done = () => { clearTimeout(timer); document.removeEventListener('visibilitychange', onHide); };
    const timer = setTimeout(() => { done(); img.src = ''; reject(new Error(hidden ? 'hidden' : 'timeout')); }, LOAD_TIMEOUT_MS);
    img.onload = () => {
      done();
      if (img.naturalWidth < 50 || img.naturalHeight < 50) { reject(new Error('too small')); return; }
      // Decoding ahead makes the fade smooth, but browsers hold it back while the page is hidden
      // (window covered, iPad asleep), so don't wait on it for more than a moment.
      Promise.race([img.decode().catch(() => {}), new Promise(r => setTimeout(r, 2000))]).then(() => resolve(img));
    };
    img.onerror = () => { done(); reject(new Error('failed')); };
    img.src = url;
  });
}

// Loads one piece's picture: { work, img }, or null if it won't load or doesn't fit the screen.
function tryWork(work) {
  return loadImage(work.image).then(img => {
    hostFails.set(hostOf(work.image), 0);
    // The art list's size can be missing or off; the loaded picture has the real shape.
    work.shape = shapeOf(img.naturalWidth, img.naturalHeight);
    return fits(work.shape) ? { work, img } : null;
  }, err => { if (err.message !== 'hidden') noteFailure(work.image, err.message === 'timeout'); return null; });
}

// The first of several pieces whose picture arrives, or null if none does.
function firstLoaded(works) {
  return new Promise(resolve => {
    let left = works.length;
    for (const work of works) tryWork(work).then(r => { if (r) resolve(r); else if (--left === 0) resolve(null); });
  });
}

// Finds a piece whose image actually loads. Tries several, since a museum server can be slow or down. For the
// first piece of an opening it tries three at once and shows whichever comes first, so a slow museum never
// keeps the screen on "Getting the newest art…"; `ready` is a piece the last opening had already loaded.
async function prepareNext(atOnce = 1, ready = null) {
  const avoid = new Set();
  for (let attempt = 0; attempt < 12; attempt++) {
    const works = ready ? [ready] : [];
    ready = null;
    // Pieces tried together come from different museums where it can be, so one stuck server can't hold them all up.
    const museum = w => hostOf(w.image).replace(/^\d+\./, '');      // 0.api.artsmia.org ... 6.api.artsmia.org are one
    const museums = new Set(works.map(museum));
    for (let picks = 0; works.length < atOnce && picks < 12; picks++) {
      const work = pickWork(avoid);
      if (!work) break;
      avoid.add(work.artistKey);
      if (museums.has(museum(work)) && picks < 8) continue;
      museums.add(museum(work));
      works.push(work);
    }
    if (!works.length) break;
    const found = await firstLoaded(works);
    if (found) return found;
  }
  return null;
}

// The next piece, once it has loaded, is kept for the next opening too: its picture is then already on this
// computer or iPad, so that opening starts with it at once.
function keepForNextOpening(next) {
  next.then(r => { if (r && upcoming === next) save('ready', r.work); });
}
function readyFromLastOpening() {
  const w = load('ready', null);
  if (!w || !w.image || !w.page || seen.has(w.page) || hiddenPages.has(w.page) || failed.has(w.image)) return null;
  if (!showDigital && isDigital(w)) return null;
  return usableImage(w) ? w : null;
}

// ------------------------------------------------------------------ showing it

const slides = [$('slideA'), $('slideB')];
let front = 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function displayPath(url) {
  let path = url.replace(/^https?:\/\/(www\.)?/, '').replace(/[?#].*$/, '');
  try { path = decodeURIComponent(path); } catch { /* keep as is */ }
  return path.replace(/_/g, ' ');
}

function fitArt(slide) {
  const frame = slide.querySelector('.frame'), art = slide.querySelector('.art');
  if (!frame || !art) return;
  const scale = Math.min(frame.clientWidth / art.naturalWidth, frame.clientHeight / art.naturalHeight);
  art.style.width = Math.round(art.naturalWidth * scale) + 'px';
  art.style.height = Math.round(art.naturalHeight * scale) + 'px';
}

function show({ work, img }) {
  const next = slides[1 - front], prev = slides[front];
  next.replaceChildren();

  const wash = el('div', 'wash');
  wash.style.backgroundImage = `url("${work.image.replace(/"/g, '%22')}")`;
  const frame = el('div', 'frame');
  img.className = 'art';
  img.alt = `${work.title} by ${work.artist}`;
  frame.append(img);

  const who = el('div', 'who');
  who.append(el('span', 'artist', work.artist), el('span', 'dot', '·'), el('span', 'country', work.country));
  const what = el('div', 'what', work.date ? `${work.title}, ${work.date}` : work.title);
  const where = el('a', 'where', displayPath(work.page));
  where.href = work.page;
  where.target = '_blank';
  where.rel = 'noopener';
  where.title = work.source;
  const label = el('div', 'label');
  label.append(who, what, where);

  next.append(wash, el('div', 'shade'), frame, label);
  fitArt(next);
  next.classList.add('front');
  prev.classList.remove('front');
  void next.offsetWidth;          // start the fade from fully transparent
  next.classList.add('shown');
  front = 1 - front;
  setTimeout(() => { if (slides[front] !== prev) prev.classList.remove('shown'); }, 1500);
  $('welcome').classList.add('gone');
  shownWork = work;
  window.ArtDetails?.newPiece(work);   // the details sheet (details.js) starts hidden for every new piece
}

// ------------------------------------------------------------------ the show

const history = [];      // shown pieces, for going back
let place = -1;          // where we are in history
let upcoming = null;     // the next piece, loading in the background
let timer = null;
let timeLeft = 0;        // ms until the next piece, counting only time the show is actually on screen
let timerStarted = 0;
let paused = false;
let held = false;        // the details sheet is open (iPad and iPhone): the piece stays until it's closed
let busy = false;

function setStatus(text) {
  statusEl.textContent = text || '';
  document.body.classList.toggle('has-status', !!text);   // the "Details" handle gives way to it
}

function runTimer() {
  clearTimeout(timer);
  timer = null;
  if (!paused && !held && !document.hidden) {
    timerStarted = Date.now();
    timer = setTimeout(advance, timeLeft);
  }
  tellRightScreen();
}

function schedule(ms = SECONDS_PER_PIECE * 1000) {
  // On the PC, pieces change on the minute, in step with the Morning and Night Screens, which switch apps
  // on the minute: each time the show comes up there, a new piece arrives with it.
  if (DESKTOP && ms === SECONDS_PER_PIECE * 1000) ms = 60000 - (Date.now() % 60000) || 60000;
  timeLeft = ms;
  runTimer();
}

async function advance() {
  if (busy || !byCountry.size) return;
  busy = true;
  clearTimeout(timer);
  let ready;
  if (place < history.length - 1) {                  // stepping forward again after going back
    const work = history[place + 1];
    ready = await loadImage(work.image).then(img => ({ work, img }), () => null);
    if (ready) place++;
  } else {
    ready = await (upcoming || (history.length ? prepareNext() : prepareNext(3, readyFromLastOpening())));
    upcoming = null;
    if (ready) { history.push(ready.work); place = history.length - 1; remember(ready.work); }
  }
  if (ready) {
    show(ready);
    setStatus(paused ? 'Paused' : '');
  } else {
    setStatus("Can't reach the art collections right now. Trying again…");
    $('welcomeNote').textContent = "Can't reach the art collections. Is the internet connected? Trying again…";
  }
  busy = false;
  if (!upcoming) { upcoming = prepareNext(); keepForNextOpening(upcoming); }
  schedule(ready ? SECONDS_PER_PIECE * 1000 : 15000);
}

async function goBack() {
  if (busy || place <= 0) return;
  busy = true;
  const work = history[place - 1];
  const ready = await loadImage(work.image).then(img => ({ work, img }), () => null);
  if (ready) { place--; show(ready); }
  busy = false;
  schedule();
}

function togglePause() {
  if (!paused && timer) timeLeft = Math.max(0, timeLeft - (Date.now() - timerStarted));
  paused = !paused;
  setStatus(paused ? 'Paused' : '');
  document.body.classList.toggle('paused', paused);       // shows the Digital art button (iPad)
  if (paused) { clearTimeout(timer); timer = null; tellRightScreen(); } else runTimer();   // resume where it left off
}

// While the details sheet (details.js) is open the clock waits, and picks up where it was when it closes.
function holdClock(on) {
  if (on === held) return;
  if (on && timer) timeLeft = Math.max(0, timeLeft - (Date.now() - timerStarted));
  held = on;
  if (held) { clearTimeout(timer); timer = null; } else runTimer();
}
window.ArtShow = { holdClock, current: () => shownWork };

// ------------------------------------------------------------------ the right screen (desktop show only)

// The two screens share what's showing through launch.ps1's web server: this one posts the piece on screen
// (and when the next one is due), and picks up the buttons pressed and the Light / Dark switch on the right.
let shownWork = null, lastSent = '';
function tellRightScreen() {
  if (!DESKTOP || !shownWork) return;
  const { artist, country, title, date, source, page, image } = shownWork;
  const body = JSON.stringify({ work: { artist, country, title, date, source, page, image },
                                paused, nextAt: timer ? timerStarted + timeLeft : null,
                                seconds: SECONDS_PER_PIECE, canGoBack: place > 0, digital: showDigital });
  if (body === lastSent) return;
  lastSent = body;
  fetch('/api/state?key=now', { method: 'POST', body }).catch(() => {});
}

// ?theme= in the address (the Morning and Night Screens use it) wins over the switch.
const FORCED_THEME = new URLSearchParams(location.search).get('theme');
function applyTheme(theme) { document.body.classList.toggle('light', (FORCED_THEME || theme) === 'light'); }

async function listenToRightScreen() {
  let v = -1, lastCommand = null;
  for (;;) {
    try {
      const r = await (await fetch('/api/state?v=' + v, { cache: 'no-store' })).json();
      v = r.v;
      applyTheme(r.state.theme);
      setDigital(r.state.digital === true);
      if (Array.isArray(r.state.hidden)) hidePieces(r.state.hidden);
      const c = r.state.command;
      if (c && lastCommand !== null && c.n !== lastCommand) {
        if (c.do === 'next') advance();
        else if (c.do === 'back') goBack();
        else if (c.do === 'pause') togglePause();
      }
      lastCommand = c ? c.n : 0;
    } catch {
      await new Promise(r => setTimeout(r, 2000));   // the server is starting or closing
    }
  }
}

if (DESKTOP) {
  $('close').addEventListener('click', () => window.close());
  document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });
  listenToRightScreen();
}

function toggleFullscreen() {
  const d = document, e = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (e.requestFullscreen || e.webkitRequestFullscreen)?.call(e);
}

// ------------------------------------------------------------------ controls

// Keyboard (computer): arrows step, Space pauses, F for full screen.
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') advance();
  else if (e.key === 'ArrowLeft') goBack();
  else if (e.key === ' ') { e.preventDefault(); togglePause(); }
  else if (!DESKTOP && (e.key === 'f' || e.key === 'F' || e.key === 'F11')) { e.preventDefault(); toggleFullscreen(); }
});
if (!touch && !DESKTOP) document.addEventListener('dblclick', toggleFullscreen);

// Touch (iPad): swipe left for the next piece, right to go back, tap to pause. Swiping up opens the details
// sheet (details.js), which handles its own swipes and taps first.
let touchStart = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStart = e.touches.length === 1 ? { x: t.clientX, y: t.clientY, at: Date.now() } : null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (window.ArtDetails?.claimed(e)) { touchStart = null; return; }
  if (!touchStart || e.target.closest('a')) return;   // tapping the link opens the piece's page
  if (e.target.closest('#digital, #hideThis')) { touchStart = null; return; }   // their clicks (below) do it
  const t = e.changedTouches[0], dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? advance() : goBack();
  else if (Math.hypot(dx, dy) < 12 && Date.now() - touchStart.at < 500) togglePause();
  touchStart = null;
});

// Turning the iPad or resizing the window re-fits the art to the new frame. (Watching the page's size
// catches every change; a turned iPad doesn't always send a resize event.) On the iPad, turning it also
// changes which pieces fit: the next one is picked again, and a piece that no longer fits is replaced
// once the turn has settled.
let lastShape = screenShape(), turnTimer;
function onSizeChange() {
  slides.forEach(fitArt);
  if (!MATCH_SHAPE || screenShape() === lastShape) return;
  lastShape = screenShape();
  upcoming = null;
  clearTimeout(turnTimer);
  turnTimer = setTimeout(() => {
    const current = history[place];
    if (current && !fits(current.shape) && !paused) advance();
  }, 700);
}
new ResizeObserver(onSizeChange).observe(document.body);
window.addEventListener('resize', onSizeChange);              // also fires while the page is in the background
window.addEventListener('orientationchange', onSizeChange);

// Hide the mouse pointer when it's not moving.
let idleTimer;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
});

// On an iPad the show is a picture frame: keep the screen from going to sleep while it's open.
let wakeLock = null;
async function keepScreenOn() {
  if (!touch || !navigator.wakeLock || document.hidden || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch { /* not allowed right now: the screen sleeps as usual */ }
}

// While the show is minimized, covered or in the background, the clock stops: each piece gets its full
// minute on screen. Coming back after a while also fetches the newest art list (an iPad home-screen app
// resumes where it was instead of starting over, so this is its "opening").
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (timer) timeLeft = Math.max(0, timeLeft - (Date.now() - timerStarted));
    clearTimeout(timer);
    timer = null;
  } else {
    if (Date.now() - catalogCheckedAt > 10 * 60e3) refreshCatalog();
    keepScreenOn();
    runTimer();
  }
});

// ------------------------------------------------------------------ start

$('digital').textContent = `Digital art: ${showDigital ? 'On' : 'Off'}`;
$('digital').classList.toggle('on', showDigital);
$('digital').addEventListener('click', e => { e.stopPropagation(); setDigital(!showDigital); });
$('hideThis').addEventListener('click', e => { e.stopPropagation(); if (shownWork) hidePieces([shownWork.page]); });

(async function start() {
  catalogCheckedAt = Date.now();
  try {
    const [catalog] = await Promise.all([fetchCatalog(), loadSharedSeen()]);
    useCatalog(catalog);
  } catch {
    $('welcomeNote').textContent = "Can't get the art list. Is the internet connected? Trying again…";
    setTimeout(start, 15000);
    return;
  }
  keepScreenOn();
  setInterval(refreshCatalog, CATALOG_REFRESH_MS);
  advance();
})();
</script>
</body>
</html>
